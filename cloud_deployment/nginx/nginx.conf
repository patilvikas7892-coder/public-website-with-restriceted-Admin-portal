# ==============================================================================
# Nginx Cloud Reverse Proxy & IP Security Firewall Configuration
# Assignment 19: Public Website with Restricted Admin Portal
# Students: Vikas & Vijit | Host: Ubuntu 24.04 LTS (AWS EC2)
# ==============================================================================

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with Client IP and Geo/Security info
    log_format security_combined '$remote_addr - $remote_user [$time_local] '
                                 '"$request" $status $body_bytes_sent '
                                 '"$http_referer" "$http_user_agent" '
                                 'SSL="$ssl_protocol/$ssl_cipher"';

    access_log /var/log/nginx/access.log security_combined;
    error_log /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # --------------------------------------------------------------------------
    # TASK 3: ALLOW HTTPS ONLY (PORT 80 HTTP -> PORT 443 HTTPS REDIRECT)
    # --------------------------------------------------------------------------
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name portal.cloudtech.edu www.portal.cloudtech.edu;

        # Redirect all insecure HTTP requests to HTTPS with 301 Moved Permanently
        return 301 https://$host$request_uri;
    }

    # --------------------------------------------------------------------------
    # SECURE HTTPS SERVER (PORT 443) WITH TLS 1.3 & IP ACCESS CONTROL
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name portal.cloudtech.edu;

        # SSL Certificates (Assignment 19: Deliverable 5)
        ssl_certificate /etc/ssl/certs/portal_cloudtech_cert.pem;
        ssl_certificate_key /etc/ssl/private/portal_cloudtech_key.pem;

        # Modern Cryptographic Hardening
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        client_max_body_size 32M;

        # ----------------------------------------------------------------------
        # PUBLIC ACCESS (0.0.0.0/0) - HOMEPAGE & STATIC ASSETS
        # ----------------------------------------------------------------------
        location / {
            # Open to the entire world
            allow all;

            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # OBJECT STORAGE STATIC ASSETS CACHING REVERSE PROXY
        # ----------------------------------------------------------------------
        location /storage/public/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_cache_valid 200 1d;
            expires 7d;
            add_header Cache-Control "public, no-transform";
            add_header X-Cache-Status "HIT-S3-PROXY";
        }

        # ----------------------------------------------------------------------
        # RESTRICTED ADMIN PORTAL (COLLEGE IP ONLY: 203.0.113.195/32)
        # ----------------------------------------------------------------------
        location /admin {
            # 1. Allow Designated College Public Static IP (Assignment 19)
            allow 203.0.113.195/32;

            # 2. Allow College Campus Leased Subnet
            allow 203.0.113.0/24;

            # 3. Allow Localhost VM loopback for internal maintenance
            allow 127.0.0.1;
            allow ::1;

            # 4. Deny ALL external public internet connections
            deny all;

            # Proxy to Python Flask backend
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Custom 403 Forbidden handler
        error_page 403 /custom_403.html;
        location = /custom_403.html {
            root /var/www/error_pages;
            internal;
        }
    }
}
